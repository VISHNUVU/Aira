[project]
name = "aria-sidecar"
version = "0.1.0"
description = "Python sidecar for Aria — local self-improving AI (engine, memory, feedback, trainer, tools)"
requires-python = ">=3.10"
dependencies = [
    # Core (platform-independent) — needed everywhere:
    "numpy>=1.24",
    # PDF text extraction for Memory file uploads (documents.py). Pure
    # Python, no native extension — deliberately not PyMuPDF/fitz, which
    # pulls in a much heavier compiled binary for the same basic text-layer
    # extraction this app needs (see the cv2 bloat incident in
    # aria-sidecar.spec for why unnecessary weight in a frozen build has
    # been a real, previously-paid cost here, not just a style preference).
    "pypdf>=4",
]

[project.optional-dependencies]
# Apple Silicon inference + on-device QLoRA training.
#
# mlx-vlm is NOT listed here on purpose, even though it's load-bearing for
# unified/multimodal Gemma checkpoints (engine/mlx_driver.py routes those
# through it). Its declared metadata wants transformers>=5.5, but mlx-lm
# breaks on anything past transformers==5.0.0 (`AutoTokenizer.register`
# signature changed: `AttributeError: 'str' object has no attribute
# '__module__'`) — verified 5.0.0 works fine with mlx-vlm in practice
# despite its stated floor. Declaring both in one extras group makes pip's
# resolver see an unsatisfiable conflict and refuse the whole install
# (confirmed: this silently produced a lean/fake-only build once already).
# scripts/build-macos.sh installs mlx-vlm as a separate `--no-deps` step and
# force-pins transformers afterward — imperative steps pip can't "refuse"
# the way it can a single declarative resolve.
mlx = [
    "mlx>=0.18",
    "mlx-lm>=0.19",
    "mlx-embeddings>=0.0.3",
    "huggingface_hub>=0.24",
]
# Cross-platform inference (Windows / Linux / mobile). huggingface_hub is
# declared explicitly here (not left to transitive resolution) because
# LlamaCppDriver.download() imports it directly for hf_hub_download/HfApi —
# without it, every model download on Windows fails immediately with
# "huggingface_hub isn't available in this build" (a real, previously-shipped
# bug: build-windows.ps1's `pip install -e ".[llamacpp,memory]"` never pulled
# it in, since neither llama-cpp-python nor lancedb/pyarrow depend on it).
llamacpp = [
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.24",
]
# Vector store for RAG memory (pick one; lancedb is embedded + fast):
memory = [
    "lancedb>=0.13",
    "pyarrow>=15",
]
# Natural offline text-to-speech (neural voice). The macOS `say` fallback and
# the fake test voice need nothing here — this is only for the Kokoro backend:
voice = [
    "kokoro>=0.9",
    "soundfile>=0.12",
]
# Local image generation (image_gen.py shells out to its CLI — see that
# module's docstring for why, and for why the model is FLUX.2 Klein via
# mlx-community rather than the "default" FLUX.1-schnell: schnell's upstream
# repo is gated on HuggingFace, a dead end with no auth flow anywhere in
# this app). Pulls in full PyTorch (~2GB) — a deliberate, accepted exception
# to this project's otherwise MLX-only dependency policy; there is currently
# no mature pure-MLX local image generator to avoid it with.
images = [
    "mflux>=0.18",
]
# Dev / test:
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine", "voice"]
py-modules = ["memory", "feedback", "trainer", "eval_gate", "tools", "store", "app", "speech", "documents", "chat_history", "image_gen", "image_trigger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
